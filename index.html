<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#04040a; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #canvasHolder { position:fixed; inset:0; }
  #overlay {
    position:fixed; top:0; left:0; right:0; z-index:5;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 20px 0; pointer-events:none; color:#eaf2ff;
    text-shadow:0 2px 12px rgba(0,0,0,.6);

    font-size:15px; letter-spacing:.14em; font-weight:600; text-transform:uppercase;
    margin:0 0 6px; opacity:.85; color:#7fd7ff;

  #status {
    position:fixed; left:0; right:0; bottom:96px; z-index:5; text-align:center;
    font-size:12px; color:#8fa2c0; pointer-events:none; letter-spacing:.02em;
  }
  #status.warn { color:#ffb37a; }
  /* VRButton gets injected by three.js and styled via its own inline styles;
     we just nudge it up a touch and restyle to match the void aesthetic */
  #VRButton {
    background: rgba(10,16,32,.72) !important;
    border: 1px solid rgba(127,215,255,.35) !important;
    color: #bfe9ff !important;
    letter-spacing: .08em !important;
    text-transform: uppercase;
    font-size: 12px !important;
    backdrop-filter: blur(6px);
  }

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(0, 1.6, 2.2);

const rig = new THREE.Group();
rig.add(camera);
rig.position.set(0, 0, 2.6);
scene.add(rig);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('canvasHolder').appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 1.5, 0);
orbit.enableDamping = true;
orbit.dampingFactor = 0.08;
orbit.minDistance = 0.5;
orbit.maxDistance = 8;
orbit.update();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

      midColor:    { value: new THREE.Color(0x1b1440) },
    },
    vertexShader: `
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      varying vec3 vWorldPos;
      uniform vec3 topColor;
      uniform vec3 bottomColor;
      uniform vec3 midColor;
      void main() {
        float h = normalize(vWorldPos).y;
        vec3 col = h > 0.0 ? mix(midColor, topColor, pow(h, 0.9)) : mix(midColor, bottomColor, pow(-h, 0.6));
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
}

/* ============================================================
   ICON TEXTURES (drawn on canvas — no external/copyrighted art)
   ============================================================ */
function makeIconTexture(draw, bg = 'rgba(0,0,0,0)') {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = '#eaf6ff';
  ctx.fillStyle = '#eaf6ff';
  ctx.lineWidth = 12;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  draw(ctx, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const icons = {
  compass: (ctx, s) => {
    ctx.beginPath(); ctx.arc(s/2, s/2, s*0.32, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(s*0.5, s*0.28); ctx.lineTo(s*0.58, s*0.5); ctx.lineTo(s*0.5, s*0.72); ctx.lineTo(s*0.42, s*0.5);
    ctx.closePath(); ctx.fill();
  },
  cart: (ctx, s) => {
    ctx.beginPath(); ctx.moveTo(s*0.22,s*0.28); ctx.lineTo(s*0.32,s*0.28); ctx.lineTo(s*0.42,s*0.6); ctx.lineTo(s*0.74,s*0.6); ctx.lineTo(s*0.82,s*0.38); ctx.lineTo(s*0.34,s*0.38);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(s*0.46,s*0.74,s*0.05,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.7,s*0.74,s*0.05,0,Math.PI*2); ctx.fill();
  },
  camera: (ctx, s) => {
    ctx.beginPath(); ctx.roundRect(s*0.2,s*0.34,s*0.6,s*0.4,s*0.06); ctx.stroke();
    ctx.beginPath(); ctx.arc(s*0.5,s*0.54,s*0.14,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(s*0.38,s*0.26,s*0.24,s*0.1,s*0.02); ctx.stroke();
  },
  gear: (ctx, s) => {
    const cx=s/2, cy=s/2, r=s*0.22;
    ctx.beginPath();
    for (let i=0;i<8;i++){
      const a = i/8*Math.PI*2;
      const x1=cx+Math.cos(a)*r, y1=cy+Math.sin(a)*r;
      const x2=cx+Math.cos(a)*(r+s*0.1), y2=cy+Math.sin(a)*(r+s*0.1);
      ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    }
    ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,r*0.4,0,Math.PI*2); ctx.stroke();
  },
  globe: (ctx, s) => {
    ctx.beginPath(); ctx.arc(s/2,s/2,s*0.3,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(s/2,s/2,s*0.13,s*0.3,0,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.2,s*0.5); ctx.lineTo(s*0.8,s*0.5); ctx.stroke();
  },
  search: (ctx, s) => {
    ctx.beginPath(); ctx.arc(s*0.44,s*0.44,s*0.18,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.58,s*0.58); ctx.lineTo(s*0.76,s*0.76); ctx.stroke();
  },
  bell: (ctx, s) => {
    ctx.beginPath();
    ctx.moveTo(s*0.32,s*0.56);
    ctx.quadraticCurveTo(s*0.32,s*0.28,s*0.5,s*0.28);
    ctx.quadraticCurveTo(s*0.68,s*0.28,s*0.68,s*0.56);
    ctx.lineTo(s*0.76,s*0.66); ctx.lineTo(s*0.24,s*0.66); ctx.closePath();
    ctx.stroke();
    ctx.beginPath(); ctx.arc(s*0.5,s*0.74,s*0.05,0,Math.PI*2); ctx.fill();
  },
  share: (ctx, s) => {
    ctx.beginPath(); ctx.arc(s*0.28,s*0.5,s*0.07,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.68,s*0.3,s*0.07,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.68,s*0.7,s*0.07,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(s*0.28,s*0.5); ctx.lineTo(s*0.68,s*0.3); ctx.moveTo(s*0.28,s*0.5); ctx.lineTo(s*0.68,s*0.7);
    ctx.stroke();
  },
  person: (ctx, s) => {
    ctx.beginPath(); ctx.arc(s*0.5,s*0.36,s*0.14,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(s*0.5,s*0.86,s*0.28,Math.PI,0); ctx.stroke();
  },
  theme: (ctx, s) => {
    ctx.beginPath(); ctx.arc(s*0.5,s*0.5,s*0.26,0,Math.PI*2); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.arc(s*0.5,s*0.5,s*0.26,0,Math.PI*2); ctx.clip();
    ctx.fillRect(s*0.5,s*0.24,s*0.26,s*0.52);
    ctx.restore();
  }
};

/* ============================================================
   AUDIO ENGINE
   ============================================================ */
const listener = new THREE.AudioListener();
camera.add(listener);
const audioCtx = listener.context;
const buffers = {};
let audioReady = false;

function b64ToArrayBuffer(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

async function loadSounds() {
  const entries = Object.entries(SOUND_DATA_B64);
  await Promise.all(entries.map(async ([role, b64]) => {
    const arrBuf = b64ToArrayBuffer(b64);
    const decoded = await audioCtx.decodeAudioData(arrBuf.slice(0));
    buffers[role] = decoded;
  }));
  audioReady = true;
}
loadSounds();

function playSound(role, { volume = 0.7, rate = 1.0 } = {}) {
  if (!audioReady || !buffers[role]) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const sound = new THREE.Audio(listener);
  sound.setBuffer(buffers[role]);
  sound.setVolume(volume);
  sound.playbackRate = rate;
  sound.play();
}

function roundedPlane(w, h, r, color, opacity = 1) {
  const shape = new THREE.Shape();
  const x = -w/2, y = -h/2;
  shape.moveTo(x + r, y);
  shape.lineTo(x + w - r, y);
  shape.quadraticCurveTo(x + w, y, x + w, y + r);
  shape.lineTo(x + w, y + h - r);
  shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  shape.lineTo(x + r, y + h);
  shape.quadraticCurveTo(x, y + h, x, y + h - r);
  shape.lineTo(x, y + r);
  shape.quadraticCurveTo(x, y, x + r, y);
  const geo = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide });
  return new THREE.Mesh(geo, mat);
}

  // remove the transient close-button interactable

  if (idx >= 0) interactables.splice(idx, 1);
}

function animateScale(obj, target, ms, done) {
  const start = obj.scale.x;
  const t0 = performance.now();
  function step(now) {
    const p = Math.min(1, (now - t0) / ms);
    const eased = 1 - Math.pow(1 - p, 3);
    const s = start + (target - start) * eased;
    obj.scale.set(s, s, s);
    if (p < 1) requestAnimationFrame(step); else if (done) done();
  }
  requestAnimationFrame(step);
}

function dockAction(role) {
  if (role === 'notify') { openPanel('Notifications'); return; }

/* ============================================================
   CONTROLLERS — laser pointers, raycasting, input
   ============================================================ */
const raycaster = new THREE.Raycaster();
const tempMatrix = new THREE.Matrix4();

function buildController(index) {
  const controller = renderer.xr.getController(index);
  controller.userData.hovered = null;
  controller.userData.handedness = null;

  const lineGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1),
  ]);
  const line = new THREE.Line(
    lineGeo,
    new THREE.LineBasicMaterial({ color: 0x7fd7ff, transparent: true, opacity: 0.7 })
  );
  line.name = 'laser';
  line.scale.z = 3;
  controller.add(line);

  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.012, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0x7fd7ff })
  );
  dot.visible = false;
  dot.name = 'dot';
  controller.add(dot);

  // simple procedural controller body (no external model dependency)
  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.018, 0.09, 4, 8),
    new THREE.MeshStandardMaterial({ color: 0x1a2438, roughness: 0.4, metalness: 0.2 })
  );
  body.rotation.x = Math.PI / 2.4;
  body.position.z = 0.03;
  controller.add(body);

  controller.addEventListener('connected', (e) => {
    controller.userData.handedness = e.data.handedness;
  });
  controller.addEventListener('disconnected', () => {
    controller.userData.handedness = null;
  });

  controller.addEventListener('selectstart', () => {
    playSound('press', { volume: 0.55 });
    controller.userData.pressed = true;
    const hit = controller.userData.hovered;
    if (hit) animateScale(hit.group, 0.9, 80);
  });
  controller.addEventListener('selectend', () => {
    playSound('release', { volume: 0.45 });
    controller.userData.pressed = false;
    const hit = controller.userData.hovered;
    if (hit) {
      animateScale(hit.group, 1.0, 120);
      playSound('select', { volume: 0.6 });
      hit.onSelect && hit.onSelect();
    }
  });
  controller.addEventListener('squeezestart', () => {
    playSound('back', { volume: 0.55 });
    if (panelOpen) closePanel(false);
  });

  rig.add(controller);
  return controller;
}

const controller0 = buildController(0);
const controller1 = buildController(1);
const controllers = [controller0, controller1];

/* ============================================================
   HOVER DETECTION (per-frame raycast per controller)
   ============================================================ */
function updateHover(controller) {
  const dot = controller.getObjectByName('dot');
  tempMatrix.identity().extractRotation(controller.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

  const meshes = interactables.map(o => o.mesh);
  const hits = raycaster.intersectObjects(meshes, false);

  let hitObj = null;
  if (hits.length) {
    const mesh = hits[0].object;
    hitObj = interactables.find(o => o.mesh === mesh);
    dot.visible = true;
    dot.position.copy(controller.worldToLocal(hits[0].point.clone()));
    controller.getObjectByName('laser').scale.z = hits[0].distance;
  } else {
    dot.visible = false;
    controller.getObjectByName('laser').scale.z = 3;
  }

  const prev = controller.userData.hovered;
  if (hitObj !== prev) {
    if (prev) {
      prev.mesh.material.color.set(prev.baseColor);
      animateScale(prev.group, 1.0, 120);
    }
    if (hitObj) {
      hitObj.mesh.material.color.copy(hitObj.hoverColor);
      animateScale(hitObj.group, 1.08, 120);
      playSound('hover', { volume: 0.35 });
    }
    controller.userData.hovered = hitObj;
  }
}

/* ============================================================
   LOCOMOTION — left stick move, right stick snap-turn
   ============================================================ */
const moveSpeed = 1.6; // m/s
const deadzone = 0.18;
let lastSnapTurn = 0;
const snapCooldown = 380; // ms
const snapAngle = Math.PI / 4;
const forward = new THREE.Vector3();
const right = new THREE.Vector3();

function handleInput(dt) {
  const session = renderer.xr.getSession();
  if (!session) return;

  for (const source of session.inputSources) {
    if (!source.gamepad) continue;
    const axes = source.gamepad.axes;
    if (!axes || axes.length < 2) continue;
    // Touch controllers commonly report thumbstick on axes[2]/axes[3];
    // fall back to axes[0]/axes[1] if only two axes are exposed.
    const ax = axes.length >= 4 ? axes[2] : axes[0];
    const ay = axes.length >= 4 ? axes[3] : axes[1];

    if (source.handedness === 'left') {
      if (Math.abs(ax) > deadzone || Math.abs(ay) > deadzone) {
        camera.getWorldDirection(forward);
        forward.y = 0; forward.normalize();
        right.crossVectors(forward, camera.up).normalize();
        const move = new THREE.Vector3();
        move.addScaledVector(forward, -ay * moveSpeed * dt);
        move.addScaledVector(right, ax * moveSpeed * dt);
        rig.position.add(move);
      }
    } else if (source.handedness === 'right') {
      const now = performance.now();
      if (Math.abs(ax) > 0.6 && now - lastSnapTurn > snapCooldown) {
        const dir = ax > 0 ? -1 : 1;
        rig.rotateY(snapAngle * dir);
        lastSnapTurn = now;
      }
    }
  }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
const clock = new THREE.Clock();
let toastFired = false;

renderer.xr.addEventListener('sessionstart', () => {
  orbit.enabled = false;
  toastFired = false;
  setTimeout(() => { if (renderer.xr.isPresenting) showToast('Welcome back'); }, 4000);
});
renderer.xr.addEventListener('sessionend', () => {
  orbit.enabled = true;
});

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (renderer.xr.isPresenting) {
    handleInput(dt);
    controllers.forEach(updateHover);
  } else {
    orbit.update();
  }

  // gentle idle bob on the shelf for life
  shelfRoot.position.y = 1.55 + Math.sin(performance.now() * 0.0006) * 0.01;

  if (toastRoot.visible) {
    toastRoot.position.copy(camera.getWorldPosition(new THREE.Vector3()));
    const dir = camera.getWorldDirection(new THREE.Vector3());
    toastRoot.position.addScaledVector(dir, 1.2);
    toastRoot.position.y += 0.35;
    toastRoot.quaternion.copy(camera.getWorldQuaternion(new THREE.Quaternion()));
  }

  renderer.render(scene, camera);
});
</script>
